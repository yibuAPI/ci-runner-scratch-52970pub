name: i54770r2-warp-infra-diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          python3 -m pip install -q requests pysocks
          which curl && curl --version | head -1
      - name: setup WARP
        run: |
          chmod +x setup_warp.sh
          bash setup_warp.sh || echo WARP_SETUP_SCRIPT_FAILED
          cat warp_method.env 2>/dev/null || true
      - name: diag
        run: |
          python3 -u probe54770_r2.py 2>&1 | tee probe_r2.log || echo R2_EXIT_NONZERO
          echo "=====tail====="; tail -c 20000 probe_r2.log
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i54770r2-results
          path: |
            probe_r2.log
            results54770_r2.json
            results54770_r2.partial.json
          if-no-files-found: warn
